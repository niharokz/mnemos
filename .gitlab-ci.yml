# Mnemos CI on GitLab (free tier).
#
#   every push / merge request  check    Go (gofmt, vet, test), front end, versions, no secrets,
#                                        Docker image build — on GitLab shared runners
#   tag vX.Y.Z (= VERSION)      apk      signed APK built by your own runner (tag: mnemos-apk),
#                                        uploaded to the project's package registry
#                               image    web image pushed to the container registry (:X.Y.Z, :latest)
#                               release  a GitLab release with the CHANGELOG section and the APK
#
# The newest APK is always at
#   https://gitlab.com/niharokz/mnemos/-/releases/permalink/latest/downloads/mnemos.apk
# Runner setup and releasing: README → "Releases and the Android APK".

stages: [check, build, release]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  GOFLAGS: -mod=vendor

.release: &release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ── check ─────────────────────────────────────────────────────────────────────
go:
  stage: check
  image: golang:1.24-alpine
  script:
    - unformatted=$(gofmt -l assets.go cmd internal web)
    - '[ -z "$unformatted" ] || { echo "gofmt needed: $unformatted"; exit 1; }'
    - go vet ./...
    - go test ./...

web:
  stage: check
  image: node:22-alpine
  script:
    - for f in web/static/js/*.js; do node --check "$f"; done
    - node -e 'JSON.parse(require("fs").readFileSync("web/static/manifest.webmanifest"))'

versions:
  stage: check
  image: alpine:3.20
  script:
    - sh scripts/check-version.sh "${CI_COMMIT_TAG:-}"

public:
  stage: check
  image: alpine:3.20
  before_script:
    - apk add --no-cache git
  script:
    - sh scripts/check-public.sh

docker:
  stage: check
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: /certs
  script:
    # the web image builds, and its tests pass inside the build
    - docker build -t mnemos:ci .
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        for t in "$(cat VERSION)" latest; do docker tag mnemos:ci "$CI_REGISTRY_IMAGE:$t" && docker push "$CI_REGISTRY_IMAGE:$t"; done
      fi

# ── build ─────────────────────────────────────────────────────────────────────
apk:
  stage: build
  tags: [mnemos-apk]                      # your self-hosted shell runner (Docker + signing key); uses no CI minutes
  needs: [go, versions]
  <<: *release
  variables:
    GIT_CLEAN_FLAGS: -ffdx -e android/dist/   # the Gradle cache is a Docker volume, kept between releases
  script:
    - VERSION=$(cat VERSION)
    - '[ "v$VERSION" = "$CI_COMMIT_TAG" ] || { echo "tag $CI_COMMIT_TAG does not match VERSION $VERSION"; exit 1; }'
    - ./android/build.sh
    - cp "android/dist/mnemos-$VERSION.apk" mnemos.apk
    - 'curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file mnemos.apk
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/mnemos/$CI_COMMIT_TAG/mnemos-$CI_COMMIT_TAG.apk"'
    # release notes: this version's section of CHANGELOG.md (web) and android/CHANGELOG.md
    - awk -v v="$VERSION" '/^## /{p = index($0 " ", "## " v " ") == 1; next} p' CHANGELOG.md > release-notes.md
    - '[ -s release-notes.md ] || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }'
    - printf '\n### Android\n' >> release-notes.md
    - awk -v v="$VERSION" '/^## /{p = index($0 " ", "## " v " ") == 1; next} p' android/CHANGELOG.md >> release-notes.md
  artifacts:
    paths: [release-notes.md]
    expire_in: 1 week

# ── release ───────────────────────────────────────────────────────────────────
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest    # glab, used by the release: keyword
  needs: [apk, docker]
  <<: *release
  script:
    - echo "Release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: Mnemos $CI_COMMIT_TAG
    description: release-notes.md
    assets:
      links:
        - name: mnemos-$CI_COMMIT_TAG.apk
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/mnemos/$CI_COMMIT_TAG/mnemos-$CI_COMMIT_TAG.apk
          link_type: package
          direct_asset_path: /mnemos.apk
