<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#3a807a">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="samanote — markdown notes with live preview">
  <meta name="robots" content="noindex, nofollow">
  <title>samanote</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/css/nss-app.css">
  <link rel="stylesheet" href="/css/samanote.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <!-- icons, used with <svg class="i"><use href="#i-…"/></svg> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
    <symbol id="i-note-plus" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/></symbol>
    <symbol id="i-folder-plus" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10v6M9 13h6"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol>
    <symbol id="i-caret" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
    <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></symbol>
    <symbol id="i-out" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M10 13h6m-2-2 2 2-2 2"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
    <symbol id="i-raw" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  </svg>

  <!-- sign in -->
  <div id="login" class="center" hidden>
    <form class="card" id="login-form" autocomplete="on">
      <div class="brand">samanote</div>
      <label class="f"><span>User</span><input name="user" autocomplete="username" autocapitalize="none" required></label>
      <label class="f"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary block" type="submit">Sign in</button>
      <p class="err" id="login-err" role="alert"></p>
      <p class="about-link"><a href="/">What is samanote?</a></p>
    </form>
  </div>

  <!-- the app -->
  <div id="app" class="app" hidden>
    <aside class="side" id="side" aria-label="Notes">
      <div class="side-h">
        <span class="brand">samanote</span>
        <button class="ghost icon" id="new-note" title="New note (Alt+N)" aria-label="New note"><svg class="i"><use href="#i-note-plus"/></svg></button>
        <button class="ghost icon" id="new-folder" title="New folder" aria-label="New folder"><svg class="i"><use href="#i-folder-plus"/></svg></button>
        <button class="ghost icon" id="collapse-btn" title="Hide sidebar (Alt+B)" aria-label="Hide sidebar"><svg class="i"><use href="#i-panel"/></svg></button>
      </div>
      <div class="filter"><input type="search" id="filter" placeholder="Filter notes…" aria-label="Filter notes" autocomplete="off" spellcheck="false"></div>
      <nav class="tree" id="tree"></nav>
      <div class="side-foot">
        <small id="ver"></small>
        <button class="ghost icon" id="theme-btn" title="Theme" aria-label="Theme"><svg class="i"><use href="#i-theme"/></svg></button>
        <button class="ghost icon" id="logout-btn" title="Sign out" aria-label="Sign out"><svg class="i"><use href="#i-out"/></svg></button>
      </div>
    </aside>
    <div class="side-resizer" id="side-resizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar"></div>
    <div class="scrim" id="scrim" hidden></div>

    <main class="main">
      <header class="top">
        <button class="ghost icon" id="menu-btn" aria-label="Show notes"><svg class="i"><use href="#i-menu"/></svg></button>
        <div class="crumb" id="crumb"><span class="dir"></span><span class="name"></span></div>
        <span class="status" id="status" role="status" aria-live="polite"></span>
        <div class="seg" id="views" role="group" aria-label="View">
          <button data-v="edit" title="Edit (Ctrl+E)">Edit</button>
          <button data-v="split" title="Editor and preview">Split</button>
          <button data-v="preview" title="Preview (Ctrl+E)">Preview</button>
        </div>
        <button class="ghost icon" id="note-menu" aria-label="Note actions"><svg class="i"><use href="#i-more"/></svg></button>
      </header>

      <div class="conflict" id="conflict" role="alert" hidden>
        <p id="conflict-msg"></p>
        <button id="c-theirs">Load their version</button>
        <button id="c-copy">Save mine as a copy</button>
        <button class="primary" id="c-mine">Keep mine</button>
      </div>

      <div class="panes" id="panes" hidden>
        <section class="pane pane-edit" id="editor" aria-label="Editor"></section>
        <div class="split-resizer" id="split-resizer" role="separator" aria-orientation="vertical" aria-label="Resize panes"></div>
        <section class="pane pane-preview" id="preview-pane" aria-label="Preview"><article class="prose" id="preview"></article></section>
      </div>

      <div class="welcome" id="welcome" hidden>
        <div>
          <h1>Your <em>notes</em>.</h1>
          <p>Pick a note from the list, or start a new one.</p>
          <button class="primary" id="welcome-new">New note</button>
          <div id="recent"></div>
          <p class="keys"><kbd>Ctrl</kbd> <kbd>S</kbd> save · <kbd>Ctrl</kbd> <kbd>E</kbd> edit / preview · <kbd>Ctrl</kbd> <kbd>F</kbd> find · <kbd>Alt</kbd> <kbd>N</kbd> new note · <kbd>Alt</kbd> <kbd>B</kbd> sidebar</p>
        </div>
      </div>
    </main>
  </div>

  <dialog class="sheet" id="sheet"></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <noscript><p class="center">samanote needs JavaScript.</p></noscript>
</body>
</html>
