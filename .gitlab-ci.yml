# mnemostxt CI/CD
#
#   every push and merge request (GitLab shared runners)
#     check    frontend tests + build, Go vet/test, Rust fmt/test, versions, no secrets, web image
#   a version tag vX.Y.Z (your own Docker runner, tag "mnemostxt-app")
#     build    mnemostxt-X.Y.Z-amd64.deb, mnemostxt-X.Y.Z-setup.exe, mnemostxt-X.Y.Z.apk
#     release  files into the package registry + a GitLab release with permanent links:
#              …/-/releases/permalink/latest/downloads/mnemostxt.apk  (and .deb, -setup.exe)
#
# Release: write the CHANGELOG section, then  sh scripts/release.sh X.Y.Z
# Runner setup: docs/RUNNER.md

stages: [check, build, release]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

variables:
  GOFLAGS: -mod=vendor
  PKG_URL: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/mnemostxt/${CI_COMMIT_TAG}

.tag-only: &tag-only
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ── check ──────────────────────────────────────────────────────────────────
frontend:
  stage: check
  image: node:22-alpine
  needs: []
  cache:
    key: { files: [frontend/package-lock.json] }
    paths: [frontend/.npm]
  script:
    - cd frontend
    - npm ci --cache .npm --no-audit --no-fund
    - npm test
    - npm run build
  artifacts:
    expire_in: 1 day
    paths: [frontend/dist]

server:
  stage: check
  image: golang:1.24-alpine
  needs: []
  script:
    - cd server
    - unformatted=$(gofmt -l cmd internal web)
    - '[ -z "$unformatted" ] || { echo "gofmt needed: $unformatted"; exit 1; }'
    - go vet ./...
    - go test ./...

app:
  stage: check
  image: rust:1-bookworm
  needs: [frontend]
  rules:
    - if: $CI_COMMIT_TAG
    - changes: [app/**/*, frontend/**/*]
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  cache:
    key: { files: [app/Cargo.lock] }
    paths: [.cargo/registry, app/target]
  before_script:
    - apt-get update -qq && apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev >/dev/null
    - rustup component add rustfmt
  script:
    - cd app
    - cargo fmt --check
    - cargo test --locked

versions:
  stage: check
  image: alpine:3.20
  needs: []
  script:
    - sh scripts/check-version.sh "${CI_COMMIT_TAG:-}"

public:
  stage: check
  image: alpine:3.20
  needs: []
  before_script:
    - apk add --no-cache git
  script:
    - sh scripts/check-public.sh

web-image:
  stage: check
  image: docker:27
  services: [docker:27-dind]
  needs: []
  variables:
    DOCKER_TLS_CERTDIR: /certs
  script:
    - docker build -t mnemostxt:ci .

# ── build (own runner) ─────────────────────────────────────────────────────
# Runs on your runner's Docker executor *inside* the builder image, which you
# build once on that machine (docs/RUNNER.md). The runner config mounts the
# build cache at /build-cache and the signing key at /keys (read-only), so
# nothing else on the host is touched.
release-files:
  stage: build
  <<: *tag-only
  tags: [mnemostxt-app]             # your Docker runner (docs/RUNNER.md)
  image: mnemostxt-builder:2        # = BUILDER_TAG in scripts/build-release.sh
  needs: [server, versions, public]
  variables:
    BUILD_CACHE: /build-cache
    KEY_DIR: /keys
    GIT_CLEAN_FLAGS: -ffdx -e app/gen/
  script:
    - sh scripts/check-version.sh "$CI_COMMIT_TAG"
    - sh scripts/build-in-container.sh deb exe apk
    - V=$(cat VERSION)
    # into the generic package registry (file names carry the tag, e.g. mnemostxt-v0.0.1.apk)
    - |
      for pair in "mnemostxt-$V-amd64.deb:mnemostxt-$CI_COMMIT_TAG-amd64.deb" "mnemostxt-$V-setup.exe:mnemostxt-$CI_COMMIT_TAG-setup.exe" "mnemostxt-$V.apk:mnemostxt-$CI_COMMIT_TAG.apk" "SHA256SUMS:SHA256SUMS"; do
        f=${pair%%:*}; n=${pair#*:}
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "dist/release/$f" "$PKG_URL/$n"
        echo " uploaded $n"
      done
    # release notes: this version's section of CHANGELOG.md
    - awk -v v="$V" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > release-notes.md
  artifacts:
    expire_in: 30 days
    paths: [dist/release/, release-notes.md]

# ── release ────────────────────────────────────────────────────────────────
release:
  stage: release
  <<: *tag-only
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [release-files]
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: mnemostxt $CI_COMMIT_TAG
    description: release-notes.md
    assets:
      links:
        - name: Android (mnemostxt.apk)
          url: ${PKG_URL}/mnemostxt-${CI_COMMIT_TAG}.apk
          direct_asset_path: /mnemostxt.apk
          link_type: package
        - name: Windows installer (mnemostxt-setup.exe)
          url: ${PKG_URL}/mnemostxt-${CI_COMMIT_TAG}-setup.exe
          direct_asset_path: /mnemostxt-setup.exe
          link_type: package
        - name: Linux (mnemostxt.deb)
          url: ${PKG_URL}/mnemostxt-${CI_COMMIT_TAG}-amd64.deb
          direct_asset_path: /mnemostxt.deb
          link_type: package
        - name: SHA256SUMS
          url: ${PKG_URL}/SHA256SUMS
          link_type: other
