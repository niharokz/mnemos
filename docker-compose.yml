# samanote — markdown notes with live preview, on your notes folder.
# Every personal value (paths, user id, network, login) comes from .env.
services:
  samanote:
    build:
      context: .
      args:
        VERSION: 2.1.0
    image: samanote:local
    container_name: samanote
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"      # write notes as your user, not root
    # Only these variables reach the container, so a shared .env is safe.
    environment:
      TZ: ${TZ:-UTC}
      SAMANOTE_USER: ${SAMANOTE_USER:?set SAMANOTE_USER in .env}
      SAMANOTE_PASSWORD: ${SAMANOTE_PASSWORD:?set SAMANOTE_PASSWORD in .env}
      SAMANOTE_SECRET: ${SAMANOTE_SECRET:-}
      SAMANOTE_HIDDEN: ${SAMANOTE_HIDDEN:-}
      SAMANOTE_AUTOSAVE_MS: ${SAMANOTE_AUTOSAVE_MS:-1000}
      SAMANOTE_MAX_FILE_MB: ${SAMANOTE_MAX_FILE_MB:-5}
    volumes:
      - ${NOTE_PATH:?set NOTE_PATH in .env}:/notes
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    # No published port: your reverse proxy reaches samanote:8080 on the shared network.
    # For a quick local test instead, add:  ports: ["127.0.0.1:8080:8080"]
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    name: ${SAMANOTE_NETWORK:-homelab}
    external: true
