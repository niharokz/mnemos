[package]
name = "mnemostxt"
version = "0.0.1"
description = "Just a notepad for your notes folder"
authors = ["Nihar"]
license = "MIT"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
# the _lib suffix avoids a name clash with the binary on Windows (cargo#8519)
name = "mnemostxt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = "1"
dunce = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
trash = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
