# mnemostxt web — your notes folder in the browser (the desktop and Android
# apps do not need this). Every personal value comes from .env.
services:
  mnemostxt:
    build: .
    image: mnemostxt:local
    container_name: mnemostxt
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"          # writes notes as your user, not root
    # Only these variables reach the container, so a shared .env is safe.
    environment:
      TZ: ${TZ:-UTC}
      MNEMOSTXT_USER: ${MNEMOSTXT_USER:?set MNEMOSTXT_USER in .env}
      MNEMOSTXT_PASSWORD: ${MNEMOSTXT_PASSWORD:?set MNEMOSTXT_PASSWORD in .env}
      MNEMOSTXT_SECRET: ${MNEMOSTXT_SECRET:-}
      MNEMOSTXT_NOTES_NAME: ${MNEMOSTXT_NOTES_NAME:-notes}
      MNEMOSTXT_MAX_FILE_MB: ${MNEMOSTXT_MAX_FILE_MB:-20}
      MNEMOSTXT_HIDDEN: ${MNEMOSTXT_HIDDEN:-}
      MNEMOSTXT_BAN_AFTER: ${MNEMOSTXT_BAN_AFTER:-5}
      MNEMOSTXT_BAN_HOURS: ${MNEMOSTXT_BAN_HOURS:-24}
      MNEMOSTXT_BAN_PRIVATE: ${MNEMOSTXT_BAN_PRIVATE:-false}
    volumes:
      - ${NOTE_PATH:?set NOTE_PATH in .env}:/notes
      - mnemostxt-state:/state                    # remembered bans
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [proxy]
    # No published port: the reverse proxy reaches mnemostxt:8080 on the shared network.
    # For a quick local test add:  ports: ["127.0.0.1:8080:8080"]
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  mnemostxt-state:

networks:
  proxy:
    name: ${MNEMOSTXT_NETWORK:-homelab}
    external: true
